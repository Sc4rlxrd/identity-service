server:
  port: 8084

spring:
  application:
    name: identity-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

api:
  security:
    token:
      access-expiration-hours: 1
      refresh-expiration-days: 7

    rate-limit:
      login-attempts: 5
      login-timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} orderId=%X{orderId:-}] "

springdoc:
  api-docs:
    path: /v3/api-docs

