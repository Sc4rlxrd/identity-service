name: Identity Service CI

on:
  pull_request:
    branches:
      - dev
      - master

  push:
    branches:
      - dev
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root

        ports:
          - 5436:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d auth_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: dev

      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5436/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      SPRING_DATA_REDIS_TIMEOUT: 5s

      API_SECURITY_TOKEN_SECRET: dd2e2add61a0cce0eb2bfb9c2d812515

      APP_ADMIN_EMAIL: SCARLXRD@teste.com
      APP_ADMIN_PASSWORD: "1234569999"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Verify PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..15}; do
            if pg_isready \
              --host localhost \
              --port 5436 \
              --username postgres \
              --dbname auth_db; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          exit 1


      - name: Run tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Validate Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: bookcommerce/identity-service:ci
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,mode=max,scope=identity-service